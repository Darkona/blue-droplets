plugins {
    id 'java-library'
    id 'maven-publish'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.148'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = "${minecraft_label}-${mod_version}"
group = mod_group_id

base {
    archivesName = archives_name
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)
java.withSourcesJar()

// The public API (com.darkona.dropletsofthirst.api) lives in its own source set and ships twice: inside the mod jar, and
// alone as droplets-of-thirst-api for other mods to compile against. It may only use Minecraft and NeoForge.
sourceSets {
    api
}

sourceSets.main.resources { srcDir 'src/generated/resources' }
// src/disabled keeps the integrations of mods without a Minecraft 1.21.11 build (see its README). It is not a source
// set: nothing there is compiled or packaged.

repositories {
    maven {
        name = "Jared's maven"
        url = 'https://maven.blamejared.com/'
    }
    maven {
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
}

neoForge {
    version = project.neo_version
    addModdingDependenciesTo(sourceSets.api)

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
        }
        // Headless client straight into a copy of a test world: scripts/client-boot-check.sh.
        bootCheck {
            client()
            gameDirectory = project.file('run')
            programArguments.addAll '--width', '1920', '--height', '1080', '--quickPlaySingleplayer', 'bdboot'
        }
        server {
            server()
            programArgument '--nogui'
        }
        // Dedicated server in its own folder, started and stopped by scripts/server-boot-check.sh.
        serverBootCheck {
            server()
            gameDirectory = project.file('run/bootcheck-server')
            programArgument '--nogui'
        }
        gameTestServer {
            type = 'gameTestServer'
            // Only this mod's tests (Minecraft 1.21.11 selects tests by id; NeoForge no longer filters by namespace)
            programArguments.addAll '--tests', "${project.mod_id}:*"
        }
        data {
            clientData()
            programArguments.addAll '--mod', project.mod_id, '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
            sourceSet(sourceSets.api)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    implementation sourceSets.api.output

    // Optional mods from Modrinth's maven by version id, since their version numbers are shared with the Fabric builds:
    // Reliquary 1.21.11-2.0.84.1569, Jade 21.1.7, Traveler's Backpack 1.21.11-10.11.7, AppleSkin 3.0.8+mc1.21.11,
    // Serene Seasons 21.11.0.5, GlitchCore 21.11.0.4, Supernatural 3.3.4.

    compileOnly 'maven.modrinth:reliquary-reincarnations:40gMkmgJ'
    compileOnly 'maven.modrinth:jade:LDFqgwEA'
    compileOnly 'maven.modrinth:travelersbackpack:7tZN0j70'
    compileOnly 'maven.modrinth:appleskin:MH9ov9DW'
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly 'maven.modrinth:serene-seasons:IsO9cQ47'
    compileOnly 'maven.modrinth:glitchcore:6dbbrOrO'
    compileOnly 'maven.modrinth:supernatural:HlQXa171'

    // ./gradlew runClient -PwithCompat
    if (project.hasProperty('withCompat')) {
        localRuntime 'maven.modrinth:reliquary-reincarnations:40gMkmgJ'
        localRuntime 'maven.modrinth:jade:LDFqgwEA'
        localRuntime 'maven.modrinth:appleskin:MH9ov9DW'
        localRuntime 'maven.modrinth:travelersbackpack:7tZN0j70'
        localRuntime 'maven.modrinth:serene-seasons:IsO9cQ47'
        localRuntime 'maven.modrinth:glitchcore:6dbbrOrO'
        localRuntime 'maven.modrinth:supernatural:HlQXa171'
    }

    localRuntime "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : project.version.toString(),
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

tasks.named('jar', Jar) {
    from('LICENSE')
    from sourceSets.api.output
}
tasks.named('sourcesJar', Jar) {
    from sourceSets.api.allSource
}

var apiJar = tasks.register('apiJar', Jar) {
    archiveBaseName = "${archives_name}-api"
    from sourceSets.api.output
    from('LICENSE')
}
var apiSourcesJar = tasks.register('apiSourcesJar', Jar) {
    archiveBaseName = "${archives_name}-api"
    archiveClassifier = 'sources'
    from sourceSets.api.allSource
}
tasks.named('assemble') { dependsOn apiJar, apiSourcesJar }

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs.addAll(['-Xmaxerrs', '2000'])
}

// D14: only the local repository below for now; a public Maven is still to be decided.
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifactId = archives_name
            from components.java
        }
        register('api', MavenPublication) {
            artifactId = "${archives_name}-api"
            artifact apiJar
            artifact apiSourcesJar
        }
    }
    repositories {
        maven {
            name = 'maven'
            url = "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
