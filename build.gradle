plugins {
    id 'java-library'
    id 'maven-publish'
    id 'idea'
    id 'net.neoforged.moddev.legacyforge' version '2.0.141'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = [release_type, minecraft_version, mod_version].findAll { !it.isBlank() }.join('-')
group = mod_group_id

base {
    archivesName = archives_name
}

// Minecraft 1.19.2 runs on Java 17: compile for it and run the game on it.
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
java.withSourcesJar()

// The public API (com.darkona.droplets.api) lives in its own source set and ships twice: inside the mod jar, and
// alone as blue-droplets-api for other mods to compile against. It may only use Minecraft and Forge.
sourceSets {
    api
}

repositories {
    maven {
        url = 'https://cursemaven.com'
        content {
            includeGroup 'curse.maven'
        }
    }
    maven {
        name = "Jared's maven"
        url = 'https://maven.blamejared.com/'
    }
    maven {
        name = 'ModMaven'
        url = 'https://modmaven.dev'
    }
    maven {
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
}

legacyForge {
    version = "${minecraft_version}-${forge_version}"
    addModdingDependenciesTo(sourceSets.api)

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
        }
        // Headless client straight into a copy of a test world: scripts/client-boot-check.sh.
        bootCheck {
            client()
            gameDirectory = project.file('run')
            programArguments.addAll '--width', '1920', '--height', '1080', '--quickPlaySingleplayer', 'bdboot'
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
        }
        // Dedicated server in its own folder, started and stopped by scripts/server-boot-check.sh.
        serverBootCheck {
            server()
            gameDirectory = project.file('run/bootcheck-server')
            programArgument '--nogui'
        }
        // Own folder, and a new world every run (cleanGameTestWorld): saved data of earlier runs, like the poured
        // water registry, never leaks into the tests.
        gameTestServer {
            type = 'gameTestServer'
            gameDirectory = project.file('run/gametest')
            systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            systemProperty 'mixin.env.remapRefMap', 'true'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
            sourceSet(sourceSets.api)
        }
    }
}

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
    config "${mod_id}.compat.mixins.json"
}

configurations {
    localRuntime
    runtimeClasspath.extendsFrom localRuntime
}

obfuscation {
    // modLocalRuntime: compat mods on the dev runtime only, remapped like the other mod dependencies.
    createRemappingConfiguration(configurations.localRuntime)
}

dependencies {
    implementation sourceSets.api.output

    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    // Forge 43 does not ship MixinExtras: bundled in the jar.
    compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:${mixinextras_version}"))
    implementation(jarJar("io.github.llamalad7:mixinextras-forge:${mixinextras_version}"))

    // Optional compat: every use sits behind a Compat class that checks ModList, or a plugin the other mod discovers.
    modCompileOnly("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") { transitive = false }
    modCompileOnly "com.jozufozu.flywheel:flywheel-forge-${minecraft_version}:${flywheel_version}"
    modCompileOnly "com.tterrag.registrate:Registrate:${registrate_version}"
    modCompileOnly "maven.modrinth:jade:${jade_version}"
    modCompileOnly "maven.modrinth:appleskin:${appleskin_version}"
    modCompileOnly "maven.modrinth:cold-sweat:${cold_sweat_version}"
    modCompileOnly "maven.modrinth:serene-seasons:${serene_seasons_version}"
    modCompileOnly "maven.modrinth:travelersbackpack:${travelers_backpack_version}"
    modCompileOnly "maven.modrinth:reliquary-reincarnations:${reliquary_version}"
    modCompileOnly "maven.modrinth:farmers-delight:${farmers_delight_version}"
    modCompileOnly "maven.modrinth:vampirism:${vampirism_version}"
    modCompileOnly "maven.modrinth:miners-delight:${miners_delight_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"

    // ./gradlew runGameTestServer -PwithCompat: the optional mods Blue Droplets has code for, on the dev runtime.
    // Create's slim jar does not bundle Flywheel and Registrate: they go in by hand.
    if (project.hasProperty('withCompat')) {
        modLocalRuntime("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") { transitive = false }
        modLocalRuntime "com.jozufozu.flywheel:flywheel-forge-${minecraft_version}:${flywheel_version}"
        modLocalRuntime "com.tterrag.registrate:Registrate:${registrate_version}"
        modLocalRuntime "maven.modrinth:jade:${jade_version}"
        modLocalRuntime "maven.modrinth:appleskin:${appleskin_version}"
        modLocalRuntime "maven.modrinth:cold-sweat:${cold_sweat_version}"
        modLocalRuntime "maven.modrinth:serene-seasons:${serene_seasons_version}"
        modLocalRuntime "maven.modrinth:travelersbackpack:${travelers_backpack_version}"
        modLocalRuntime "maven.modrinth:reliquary-reincarnations:${reliquary_version}"
        modLocalRuntime "maven.modrinth:farmers-delight:${farmers_delight_version}"
    }
    // ./gradlew runGameTestServer -PwithDelight: the Farmer's Delight addons that exist for 1.19.2, kept apart from
    // -PwithCompat so that one stays fast; both flags combine.
    if (project.hasProperty('withDelight')) {
        modLocalRuntime "maven.modrinth:farmers-delight:${farmers_delight_version}"
        modLocalRuntime "maven.modrinth:brewin-and-chewin:${brewin_and_chewin_version}"
        modLocalRuntime "maven.modrinth:oceans-delight:${oceans_delight_version}"
        modLocalRuntime "maven.modrinth:enders-delight:${enders_delight_version}"
        modLocalRuntime "maven.modrinth:miners-delight:${miners_delight_version}"
        modLocalRuntime "maven.modrinth:fruits-delight:${fruits_delight_version}"
        modLocalRuntime "maven.modrinth:cultural-delights:${cultural_delights_version}"
        modLocalRuntime "maven.modrinth:cooks-collection:${cooks_collection_version}"
        modLocalRuntime "maven.modrinth:corn-delight:${corn_delight_version}"
        modLocalRuntime "maven.modrinth:mmlib:${mmlib_version}"
        modLocalRuntime "maven.modrinth:rustic-delight:${rustic_delight_version}"
        modLocalRuntime "maven.modrinth:crabbers-delight:${crabbers_delight_version}"
        modLocalRuntime "maven.modrinth:geckolib:${geckolib_version}"
        modLocalRuntime "maven.modrinth:ends-delight:${ends_delight_version}"
        modLocalRuntime "maven.modrinth:my-nethers-delight:${my_nethers_delight_version}"
    }
    // JEI on every dev client, as on 1.21.1.
    modLocalRuntime "mezz.jei:jei-${minecraft_version}-forge:${jei_version}"
}

var cleanGameTestWorld = tasks.register('cleanGameTestWorld', Delete) {
    delete 'run/gametest/world'
}
tasks.matching { it.name == 'runGameTestServer' }.configureEach { dependsOn cleanGameTestWorld }

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version,
            forge_version_range    : forge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml']) {
        expand replaceProperties
    }
}

tasks.named('jar', Jar) {
    from('LICENSE')
    from sourceSets.api.output
    manifest.attributes('MixinConfigs': "${mod_id}.mixins.json,${mod_id}.compat.mixins.json")
}
tasks.named('sourcesJar', Jar) {
    from sourceSets.api.allSource
}

// Mods run on SRG names in production: the API jar is remapped like the mod jar (build/devlibs holds the named one).
var apiJar = tasks.register('apiJar', Jar) {
    archiveBaseName = "${archives_name}-api"
    from sourceSets.api.output
    from('LICENSE')
    destinationDirectory = layout.buildDirectory.dir('devlibs')
}
var reobfApiJar = tasks.register('reobfApiJar', net.neoforged.moddevgradle.legacyforge.tasks.RemapJar) {
    input = apiJar.flatMap { it.archiveFile }
    archiveBaseName = "${archives_name}-api"
    destinationDirectory = layout.buildDirectory.dir('libs')
    libraries.from(sourceSets.api.compileClasspath)
    obfuscation.configureNamedToSrgOperation(remapOperation)
}
var apiSourcesJar = tasks.register('apiSourcesJar', Jar) {
    archiveBaseName = "${archives_name}-api"
    archiveClassifier = 'sources'
    from sourceSets.api.allSource
}
tasks.named('assemble') { dependsOn reobfApiJar, apiSourcesJar }

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// D14: only the local repository below for now; a public Maven is still to be decided.
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifactId = archives_name
            from components.java
        }
        register('api', MavenPublication) {
            artifactId = "${archives_name}-api"
            artifact reobfApiJar
            artifact apiSourcesJar
        }
    }
    repositories {
        maven {
            name = 'maven'
            url = "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
