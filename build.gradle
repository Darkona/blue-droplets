plugins {
    id 'java-library'
    id 'maven-publish'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.148'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = "${minecraft_label}-${mod_version}"
group = mod_group_id

base {
    archivesName = archives_name
}

java.toolchain.languageVersion = JavaLanguageVersion.of(java_version as int)
java.withSourcesJar()

// The public API (com.darkona.dropletsofthirst.api) lives in its own source set and ships twice: inside the mod jar, and
// alone as droplets-of-thirst-api for other mods to compile against. It may only use Minecraft and NeoForge.
sourceSets {
    api
}

sourceSets.main.resources { srcDir 'src/generated/resources' }
// src/disabled keeps the integrations of mods without a Minecraft 26.1 build (see its README). It is not a source
// set: nothing there is compiled or packaged.

repositories {
    maven {
        name = "Jared's maven"
        url = 'https://maven.blamejared.com/'
    }
    maven {
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
}

neoForge {
    version = project.hasProperty('withKubeJS') ? project.kubejs_neo_version : project.neo_version
    addModdingDependenciesTo(sourceSets.api)

    runs {
        client {
            client()
        }
        // Headless client straight into a copy of a test world: scripts/client-boot-check.sh.
        bootCheck {
            client()
            gameDirectory = project.file('run')
            programArguments.addAll '--width', '1920', '--height', '1080', '--quickPlaySingleplayer', 'bdboot'
        }
        server {
            server()
            programArgument '--nogui'
        }
        // Dedicated server in its own folder, started and stopped by scripts/server-boot-check.sh.
        serverBootCheck {
            server()
            gameDirectory = project.file('run/bootcheck-server')
            programArgument '--nogui'
        }
        gameTestServer {
            type = 'gameTestServer'
            // -PwithKubeJS keeps to its own folder, with the example scripts, so it never collides with other runs.
            if (project.hasProperty('withKubeJS'))
                gameDirectory = project.file('run/kubejs-test')
            // Only this mod's tests (Minecraft 26.1 selects tests by id; NeoForge no longer filters by namespace)
            programArguments.addAll '--tests', "${project.mod_id}:*"
        }
        data {
            clientData()
            programArguments.addAll '--mod', project.mod_id, '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
            sourceSet(sourceSets.api)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    implementation sourceSets.api.output

    // Optional mods from Modrinth's maven by version id, since their version numbers are shared with the Fabric builds:
    // Reliquary 26.1.2-2.0.92.1563, Jade 26.1.11, Traveler's Backpack 26.1.2-11.2.8, AppleSkin 3.0.9+mc26.1,
    // Serene Seasons 26.1.2.0.4 (26.1.2.0.7 overflows the stack in its own Biome#hasPrecipitation mixin on the client),
    // GlitchCore 26.1.2.0.2, KubeJS 26.1.2-8.0.6, Rhino 2101.2.8-build.91,
    // Better Advanced Tooltips 2601.1.0-build.9.

    compileOnly 'maven.modrinth:reliquary-reincarnations:oub7jUP0'
    compileOnly 'maven.modrinth:jade:5jKeKXwB'
    compileOnly 'maven.modrinth:travelersbackpack:glTGAXmg'
    compileOnly 'maven.modrinth:appleskin:i8MiVItH'
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly 'maven.modrinth:serene-seasons:OKhFVuHv'
    compileOnly 'maven.modrinth:glitchcore:mYUbCfgT'

    // ./gradlew runClient -PwithCompat
    if (project.hasProperty('withCompat')) {
        localRuntime 'maven.modrinth:reliquary-reincarnations:oub7jUP0'
        localRuntime 'maven.modrinth:jade:5jKeKXwB'
        localRuntime 'maven.modrinth:appleskin:i8MiVItH'
        localRuntime 'maven.modrinth:travelersbackpack:glTGAXmg'
        localRuntime 'maven.modrinth:serene-seasons:OKhFVuHv'
        localRuntime 'maven.modrinth:glitchcore:mYUbCfgT'
    }

    // ./gradlew runGameTestServer -PwithKubeJS: KubeJS with its scripting engine (Rhino), to try examples/kubejs.
    if (project.hasProperty('withKubeJS')) {
        localRuntime 'maven.modrinth:kubejs:FzLyIIBB'
        localRuntime 'maven.modrinth:rhino:SqkDvOLG'
        localRuntime 'maven.modrinth:better-advanced-tooltips:dYc3PUcQ'
    }

    localRuntime "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"
}

// -PwithKubeJS: copy the example scripts into run/kubejs-test/kubejs before the game tests, which run in that folder.
if (project.hasProperty('withKubeJS')) {
    var installKubeJSExamples = tasks.register('installKubeJSExamples', Copy) {
        from 'examples/kubejs'
        include '*_scripts/**'
        into 'run/kubejs-test/kubejs'
    }
    tasks.matching { it.name == 'runGameTestServer' }.configureEach { dependsOn installKubeJSExamples }
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : project.version.toString(),
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

tasks.named('jar', Jar) {
    from('LICENSE')
    from sourceSets.api.output
}
tasks.named('sourcesJar', Jar) {
    from sourceSets.api.allSource
}

var apiJar = tasks.register('apiJar', Jar) {
    archiveBaseName = "${archives_name}-api"
    from sourceSets.api.output
    from('LICENSE')
}
var apiSourcesJar = tasks.register('apiSourcesJar', Jar) {
    archiveBaseName = "${archives_name}-api"
    archiveClassifier = 'sources'
    from sourceSets.api.allSource
}
tasks.named('assemble') { dependsOn apiJar, apiSourcesJar }

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs.addAll(['-Xmaxerrs', '2000'])
}

// D14: only the local repository below for now; a public Maven is still to be decided.
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifactId = archives_name
            from components.java
        }
        register('api', MavenPublication) {
            artifactId = "${archives_name}-api"
            artifact apiJar
            artifact apiSourcesJar
        }
    }
    repositories {
        maven {
            name = 'maven'
            url = "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
