plugins {
    id 'java-library'
    id 'maven-publish'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.141'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = [release_type, minecraft_version, mod_version].findAll { !it.isBlank() }.join('-')
group = mod_group_id

base {
    archivesName = archives_name
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)
java.withSourcesJar()

// The public API (com.darkona.droplets.api) lives in its own source set and ships twice: inside the mod jar, and
// alone as blue-droplets-api for other mods to compile against. It may only use Minecraft and NeoForge.
sourceSets {
    api
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    maven {
        url = 'https://cursemaven.com'
        content {
            includeGroup 'curse.maven'
        }
    }
    maven { url = 'https://mvn.devos.one/snapshots' }
    maven { url = 'https://maven.ithundxr.dev/snapshots' }
    maven {
        name = "Jared's maven"
        url = 'https://maven.blamejared.com/'
    }
    maven {
        name = 'ModMaven'
        url = 'https://modmaven.dev'
    }
    maven { url = 'https://maven.createmod.net' }
    maven {
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
    maven { url = 'https://raw.githubusercontent.com/Fuzss/modresources/main/maven' }
}

neoForge {
    version = project.neo_version
    addModdingDependenciesTo(sourceSets.api)

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        // Headless client straight into a copy of a test world: scripts/client-boot-check.sh.
        bootCheck {
            client()
            gameDirectory = project.file('run')
            programArguments.addAll '--width', '1920', '--height', '1080', '--quickPlaySingleplayer', 'bdboot'
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        // Dedicated server in its own folder, started and stopped by scripts/server-boot-check.sh.
        serverBootCheck {
            server()
            gameDirectory = project.file('run/bootcheck-server')
            programArgument '--nogui'
        }
        gameTestServer {
            type = 'gameTestServer'
            // -PwithKubeJS keeps to its own folder, with the example scripts, so it never collides with other runs.
            if (project.hasProperty('withKubeJS'))
                gameDirectory = project.file('run/kubejs-test')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
            sourceSet(sourceSets.api)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    implementation sourceSets.api.output

    compileOnly("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") { transitive = false }
    compileOnly("net.createmod.ponder:ponder-neoforge:${ponder_version}+mc${minecraft_version}") { transitive = false }
    compileOnly "dev.engine-room.flywheel:flywheel-neoforge-api-${minecraft_version}:${flywheel_version}"
    compileOnly "com.tterrag.registrate:Registrate:${registrate_version}"

    compileOnly 'curse.maven:vampirism-become-a-vampire-233029:5547201'
    compileOnly 'maven.modrinth:farmers-delight:1.21.1-1.3.4'
    compileOnly 'maven.modrinth:extradelight:2.6.6'
    compileOnly 'maven.modrinth:lets-do-farm-charm:1.1.26'
    compileOnly 'maven.modrinth:lets-do-herbalbrews:1.1.4'
    compileOnly 'maven.modrinth:lets-do-brewery-farmcharm-compat:2.1.11'
    compileOnly 'maven.modrinth:architectury-api:13.0.8+neoforge'
    compileOnly 'maven.modrinth:cold-sweat:2.4.3.1'
    compileOnly 'maven.modrinth:reliquary-reincarnations:kOKl8h6O'
    compileOnly 'curse.maven:jade-324717:6291517'
    compileOnly 'curse.maven:supernatural-610880:6500773'
    compileOnly 'maven.modrinth:travelersbackpack:1.21.1-10.1.39'
    compileOnly 'curse.maven:appleskin-248787:5586600'
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly 'maven.modrinth:serene-seasons:pHEgQQUE'
    compileOnly 'maven.modrinth:glitchcore:S2TfWrZR'

    // ./gradlew runClient -PwithCompat
    if (project.hasProperty('withCompat')) {
        localRuntime("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") { transitive = false }
        localRuntime("net.createmod.ponder:ponder-neoforge:${ponder_version}+mc${minecraft_version}") { transitive = false }
        localRuntime "dev.engine-room.flywheel:flywheel-neoforge-${minecraft_version}:${flywheel_version}"
        localRuntime "com.tterrag.registrate:Registrate:${registrate_version}"
        localRuntime 'maven.modrinth:farmers-delight:1.21.1-1.3.4'
        localRuntime 'maven.modrinth:cold-sweat:2.4.3.1'
        localRuntime 'maven.modrinth:reliquary-reincarnations:kOKl8h6O'
        localRuntime 'curse.maven:jade-324717:6291517'
        localRuntime 'curse.maven:appleskin-248787:5586600'
        localRuntime 'maven.modrinth:travelersbackpack:1.21.1-10.1.39'
        localRuntime 'maven.modrinth:serene-seasons:pHEgQQUE'
        localRuntime 'maven.modrinth:glitchcore:S2TfWrZR'
    }

    // ./gradlew runGameTestServer -PwithDelight: the Farmer's Delight addons of the first batch, kept apart from
    // -PwithCompat so that one stays fast. Brewin' and Chewin' bundles its config library.
    if (project.hasProperty('withDelight')) {
        localRuntime 'maven.modrinth:farmers-delight:1.21.1-1.3.4'
        localRuntime 'maven.modrinth:brewin-and-chewin:4.5.0+1.21.1-neoforge'
        localRuntime 'maven.modrinth:extradelight:2.6.6'
        localRuntime 'maven.modrinth:oceans-delight:1.0.4'
        localRuntime 'maven.modrinth:enders-delight:1.3.1'
        localRuntime 'maven.modrinth:architectury-api:13.0.8+neoforge'
        localRuntime 'maven.modrinth:lets-do-farm-charm:1.1.26'
        localRuntime 'maven.modrinth:lets-do-herbalbrews:1.1.4'
        localRuntime 'maven.modrinth:lets-do-brewery-farmcharm-compat:2.1.11'
    }

    // Second batch, same flag. Rustic Delight is pinned by version id: the number 1.7.1 also exists for Fabric.
    if (project.hasProperty('withDelight')) {
        localRuntime 'maven.modrinth:fruits-delight:1.2.14'
        localRuntime 'maven.modrinth:cultural-delights:0.18.1-1.21.1'
        localRuntime 'maven.modrinth:cooks-collection:0.6.1-1.21.1'
        localRuntime 'maven.modrinth:expanded-delight:0.1.4-neoforge'
        localRuntime 'maven.modrinth:miners-delight:1.4.5'
        localRuntime 'maven.modrinth:lodestonelib:46jCo03u'
        localRuntime 'maven.modrinth:corn-delight:1.2.10-1.21.1'
        localRuntime 'maven.modrinth:mmlib:1.2.15-1.21.1'
        localRuntime 'maven.modrinth:rustic-delight:sAaG4pSA'
        localRuntime 'maven.modrinth:crabbers-delight:1.3.1'
        localRuntime 'maven.modrinth:ends-delight:2.6.1+neoforge.1.21.1'
        localRuntime 'maven.modrinth:my-nethers-delight:1.10.4.1'
    }

    // ./gradlew runGameTestServer -PwithKubeJS: KubeJS with its scripting engine (Rhino), to try examples/kubejs.
    if (project.hasProperty('withKubeJS')) {
        localRuntime 'maven.modrinth:kubejs:THIGFPwf'
        localRuntime 'maven.modrinth:rhino:cQ4POTah'
    }

    localRuntime "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"
}

// -PwithKubeJS: copy the example scripts into run/kubejs-test/kubejs before the game tests, which run in that folder.
if (project.hasProperty('withKubeJS')) {
    var installKubeJSExamples = tasks.register('installKubeJSExamples', Copy) {
        from 'examples/kubejs'
        include '*_scripts/**'
        into 'run/kubejs-test/kubejs'
    }
    tasks.matching { it.name == 'runGameTestServer' }.configureEach { dependsOn installKubeJSExamples }
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

tasks.named('jar', Jar) {
    from('LICENSE')
    from sourceSets.api.output
}
tasks.named('sourcesJar', Jar) {
    from sourceSets.api.allSource
}

var apiJar = tasks.register('apiJar', Jar) {
    archiveBaseName = "${archives_name}-api"
    from sourceSets.api.output
    from('LICENSE')
}
var apiSourcesJar = tasks.register('apiSourcesJar', Jar) {
    archiveBaseName = "${archives_name}-api"
    archiveClassifier = 'sources'
    from sourceSets.api.allSource
}
tasks.named('assemble') { dependsOn apiJar, apiSourcesJar }

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// D14: only the local repository below for now; a public Maven is still to be decided.
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifactId = archives_name
            from components.java
        }
        register('api', MavenPublication) {
            artifactId = "${archives_name}-api"
            artifact apiJar
            artifact apiSourcesJar
        }
    }
    repositories {
        maven {
            name = 'maven'
            url = "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
