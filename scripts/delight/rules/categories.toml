# Reglas de classify.py. La primera que coincide gana; el orden del archivo es la prioridad.
#
# Condiciones (todas las que aparezcan deben cumplirse; dentro de una lista basta una):
#   tags / not_tags        tags del item (admite comodines: "c:drinks/*")
#   effects / not_effects  ids de efectos de la comida (admite comodines)
#   tokens / not_tokens    palabras COMPLETAS de la ruta del id, separadas por no-letras (salt no coincide con salted)
#   all_tokens             todas esas palabras a la vez
#   also_tokens            otra lista de palabras: debe coincidir una de tokens Y una de also_tokens
#   only_tokens            TODAS las palabras del id estan en esa lista (para nombres simples como beef o raw_beef)
#   ids                    ids completos
#   mods, is_drink, has_food (nutrition no vacio)
#
# Orden general de las senales: 1) puerta de no-comida, 2) ids y casos especiales, 3) tags, 4) efectos, 5) palabras.
# Un caso suelto se corrige en data/categories_manual.csv (item_id,category), que gana siempre.

# ---------------------------------------------------------------- 1. lo que no es comida ni bebida
[[rule]]
name = "no_food_no_drink"
category = "non_food"
is_drink = false
has_food = false

# ---------------------------------------------------------------- 2. ids y casos especiales
[[rule]]
name = "water_container"
category = "water"
ids = ["minecraft:potion", "minecraft:water_bucket", "droplets_of_thirst:terracotta_water_bowl", "cold_sweat:filled_waterskin"]

[[rule]]
name = "not_a_real_drink"
category = "non_food"
tokens = ["jar", "flask", "splash", "lingering", "ominous", "empty", "container", "bottle_of"]
not_tokens = ["jam", "jelly", "marmalade"]
is_drink = true

[[rule]]
name = "blood"
category = "non_food"
mods = ["supernatural"]

[[rule]]
name = "debug_food"
category = "non_food"
all_tokens = ["bad", "food"]

[[rule]]
name = "soft_kombucha"
category = "drink_crafted"
tokens = ["kombucha"]

[[rule]]
name = "soft_ginger_beer"
category = "drink_crafted"
all_tokens = ["ginger", "beer"]

