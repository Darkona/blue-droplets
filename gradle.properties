org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

minecraft_version=26.3
# Minecraft version in the jar name: 26.3 covers its hotfixes
minecraft_label=26.3

jei_version=31.8.0.48
# Mod part of the version; the version users see is <minecraft_label>-<mod_version>
mod_version=1.0.0

minecraft_version_range=[26.3,26.4)
# 26.3.0.37-beta renamed ModConfig.Type (COMMON/SERVER -> LOCAL/SYNCED): JEI 31.8.0.48 and Traveler's Backpack
# 26.3-11.4.1 do not load there yet, so this build stays on .36 and does not claim .37+.
neo_version=26.3.0.36-beta
neo_version_range=[26.3.0.36-beta,26.3.0.37-beta)
loader_version_range=[12,)

mod_id=droplets_of_thirst
# Project, jar and Maven artifact name
archives_name=droplets-of-thirst
mod_name=Droplets of Thirst
mod_license=MIT
mod_group_id=com.darkona.dropletsofthirst
mod_authors=Darkona (original: ghen)
mod_description=Thirst and water purity for modern modpacks, compatible with many popular mods. Continuation of Thirst Was Taken by ghen.