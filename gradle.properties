org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

parchment_minecraft_version=1.20.1
parchment_mappings_version=2023.09.03

minecraft_version=1.20.1
java_version=17
# Minecraft version in the jar and mod version: the short name of the branch
minecraft_label=1.20.1
minecraft_version_range=[1.20.1]
# One jar for Forge and NeoForge 1.20.1: built against Forge 47.1.3, the version NeoForge 47.1 forked from, so no
# later Forge API sneaks in. NeoForge 47.1.x presents itself as "forge" 47.1.x and loader 47.
forge_version=47.1.3
forge_version_range=[47.1.3,)
# Forge for the dev runs with -PwithCompat, where some optional mods need a later 47.x
forge_compat_version=47.4.10
loader_version_range=[47,)

# Mod part of the version; the version users see is <minecraft_label>-<mod_version>
mod_version=1.0.0

mod_id=droplets_of_thirst
# Project, jar and Maven artifact name
archives_name=droplets-of-thirst
mod_name=Droplets of Thirst
mod_license=MIT
mod_group_id=com.darkona.dropletsofthirst
mod_authors=Darkona (original: ghen)
mod_description=Thirst and water purity for modern modpacks, compatible with many popular mods. Continuation of Thirst Was Taken by ghen.

# Forge 47 does not ship MixinExtras: bundled in the jar (jarJar), same version as Create 6 for 1.20.1.
mixinextras_version=0.4.1

